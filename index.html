<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTGM API Terminal</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(255, 255, 255, 0.12);
            --whatsapp-green: #25d366;
            --whatsapp-glow: rgba(37, 211, 102, 0.35);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-glow: rgba(0, 242, 254, 0.35);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Mesh Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                radial-gradient(circle at 20% 20%, rgba(79, 172, 254, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(37, 211, 102, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(147, 51, 234, 0.15) 0%, transparent 60%);
            filter: blur(60px);
            animation: moveGradient 12s ease-in-out infinite alternate;
        }

        @keyframes moveGradient {
            0% {
                transform: scale(1) translate(0, 0);
            }
            50% {
                transform: scale(1.1) translate(-2%, 3%);
            }
            100% {
                transform: scale(1) translate(2%, -3%);
            }
        }

        /* Subtle Grid Overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Main Glassmorphism Container */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            padding: 40px 30px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        /* Header / Terminal Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--accent-cyan);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--whatsapp-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--whatsapp-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .title {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            border: 1px solid transparent;
        }

        .btn i {
            font-size: 1.25rem;
            transition: transform 0.3s ease;
        }

        /* WhatsApp Channel Button */
        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            box-shadow: 0 8px 24px var(--whatsapp-glow);
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Visit Tools Button */
        .btn-tools {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #090d16;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-tools:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Footer Info */
        .footer-note {
            margin-top: 28px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: rgba(148, 163, 184, 0.6);
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>

    <!-- Main Container -->
    <div class="container">
        <div class="badge">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>
        
        <h1 class="title">FTGM API Terminal</h1>
        <p class="subtitle">Select an action below to access official developer tools and live updates.</p>

        <div class="button-group">
            <!-- Join Channel Button -->
            <a href="https://whatsapp.com/channel/0029VbDQFi9KmCPUDQEwVW2W" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>Join Channel</span>
            </a>

            <!-- Visit Tools Button -->
            <a href="https://ftgmtools.pages.dev" target="_blank" rel="noopener noreferrer" class="btn btn-tools">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                <span>Visit Tools</span>
            </a>
        </div>

        <div class="footer-note">
            ftgmtools.pages.dev
        </div>
    </div>

</body>
</html>
